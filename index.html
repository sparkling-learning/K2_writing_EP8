<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>遊戲王 - 幾何圖形對對碰</title>
    <style>
        :root {
            --primary-color: #2B579A; /* 柔和的藍色 */
            --bg-color: #F7F9FC;
            --grid-border: #333333;
            --success-color: #4CAF50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, '微軟正黑體';
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            touch-action: none; /* 防止觸控螢幕意外捲動 */
        }

        h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 10px;
        }

        #message-area {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-color);
            min-height: 35px;
            margin-bottom: 20px;
            text-align: center;
            transition: color 0.3s;
        }

        .game-area {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-label {
            font-size: 18px;
            margin-bottom: 10px;
            color: #555;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            border: 2px solid var(--grid-border);
            background-color: white;
        }

        .cell {
            border: 1px solid var(--grid-border);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* 玩家格子的拖放回饋 */
        .player-cell.drag-over {
            background-color: #E3F2FD;
            border: 2px dashed var(--primary-color);
        }

        .shape-pool {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            min-height: 80px;
            align-items: center;
        }

        .shape {
            width: 60px;
            height: 60px;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shape:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        /* SVG 樣式 */
        .shape svg {
            width: 100%;
            height: 100%;
            pointer-events: none; /* 確保拖曳事件只綁定在外層容器 */
        }

        button {
            padding: 12px 30px;
            font-size: 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            margin-top: 20px;
            font-weight: bold;
        }

        button:hover {
            background-color: #1A3C6D;
        }
    </style>
</head>
<body>

    <h1>強化視覺辨識與記憶力</h1>
    <div id="message-area">請把圖形放到右邊相同的位置！</div>

    <div class="game-area">
        <div class="board-container">
            <div class="board-label">觀察區 (左)</div>
            <div id="target-grid" class="grid"></div>
        </div>
        <div class="board-container">
            <div class="board-label">作答區 (右)</div>
            <div id="player-grid" class="grid"></div>
        </div>
    </div>

    <div class="shape-pool" id="shape-pool">
        </div>

    <button id="next-btn" onclick="nextLevel()">下一關</button>

    <script>
        // 幾何圖形的 SVG 定義
        const SHAPES = {
            triangle: '<svg viewBox="0 0 100 100"><polygon points="50,10 90,85 10,85" fill="none" stroke="#2B579A" stroke-width="6"/></svg>',
            circle: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#2B579A" stroke-width="6"/></svg>',
            rectangle: '<svg viewBox="0 0 100 100"><rect x="15" y="30" width="70" height="40" fill="none" stroke="#2B579A" stroke-width="6"/></svg>'
        };

        // 關卡設計 (對應圖片的九宮格位置 0-8)
        // [0, 1, 2]
        // [3, 4, 5]
        // [6, 7, 8]
        const LEVELS = [
            { // 圖片第一組
                target: {0: 'triangle', 3: 'circle', 6: 'rectangle'},
                requiredCount: 3
            },
            { // 圖片第二組
                target: {0: 'triangle', 2: 'rectangle', 4: 'circle'},
                requiredCount: 3
            },
            { // 圖片第三組
                target: {4: 'circle', 7: 'triangle', 8: 'rectangle'},
                requiredCount: 3
            }
        ];

        let currentLevel = 0;
        let placedCount = 0;
        let draggedShapeType = null;
        let draggedElement = null;

        const targetGrid = document.getElementById('target-grid');
        const playerGrid = document.getElementById('player-grid');
        const shapePool = document.getElementById('shape-pool');
        const messageArea = document.getElementById('message-area');
        const nextBtn = document.getElementById('next-btn');

        function initLevel() {
            placedCount = 0;
            targetGrid.innerHTML = '';
            playerGrid.innerHTML = '';
            shapePool.innerHTML = '';
            messageArea.textContent = '請把圖形放到右邊相同的位置！';
            messageArea.style.color = 'var(--primary-color)';
            nextBtn.style.display = 'none';

            const levelData = LEVELS[currentLevel];

            // 建立 3x3 網格
            for (let i = 0; i < 9; i++) {
                // 左側目標網格
                const targetCell = document.createElement('div');
                targetCell.className = 'cell';
                if (levelData.target[i]) {
                    targetCell.innerHTML = `<div class="shape">${SHAPES[levelData.target[i]]}</div>`;
                }
                targetGrid.appendChild(targetCell);

                // 右側玩家網格
                const playerCell = document.createElement('div');
                playerCell.className = 'cell player-cell';
                playerCell.dataset.index = i;
                
                // 設定拖放接收事件
                playerCell.addEventListener('dragover', handleDragOver);
                playerCell.addEventListener('dragleave', handleDragLeave);
                playerCell.addEventListener('drop', handleDrop);
                playerGrid.appendChild(playerCell);
            }

            // 在下方池子產生可拖曳的圖形
            ['triangle', 'circle', 'rectangle'].forEach(type => {
                createDraggableShape(type);
            });
        }

        function createDraggableShape(type) {
            const shapeDiv = document.createElement('div');
            shapeDiv.className = 'shape draggable';
            shapeDiv.dataset.type = type;
            shapeDiv.innerHTML = SHAPES[type];
            shapeDiv.draggable = true;

            shapeDiv.addEventListener('dragstart', (e) => {
                draggedShapeType = type;
                draggedElement = shapeDiv;
                e.dataTransfer.effectAllowed = 'move';
                // 延遲隱藏原本的元素，確保有拖曳殘影
                setTimeout(() => shapeDiv.style.opacity = '0.5', 0);
            });

            shapeDiv.addEventListener('dragend', () => {
                shapeDiv.style.opacity = '1';
                draggedShapeType = null;
            });

            shapePool.appendChild(shapeDiv);
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            this.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            
            const cellIndex = parseInt(this.dataset.index);
            const levelData = LEVELS[currentLevel];
            const expectedShape = levelData.target[cellIndex];

            // 檢查該格子是否為空，且放下的圖形是否與目標一致
            if (!this.hasChildNodes()) {
                if (expectedShape === draggedShapeType) {
                    // 放對了
                    const newShape = document.createElement('div');
                    newShape.className = 'shape';
                    newShape.innerHTML = SHAPES[draggedShapeType];
                    this.appendChild(newShape);
                    
                    // 從池子移除該圖形
                    draggedElement.remove();
                    
                    placedCount++;
                    
                    // 正向回饋
                    messageArea.textContent = "欣賞你，你好努力！";
                    messageArea.style.color = "var(--primary-color)";

                    // 檢查是否過關
                    if (placedCount === levelData.requiredCount) {
                        levelComplete();
                    }
                } else {
                    // 放錯了（或放到了不需要放圖形的格子），給予溫和提示，不播錯音效
                    messageArea.textContent = "試試看另一個格子？你可以的！";
                }
            }
        }

        function levelComplete() {
            messageArea.textContent = "太棒了，任務完成！";
            messageArea.style.color = "var(--success-color)";
            
            if (currentLevel < LEVELS.length - 1) {
                nextBtn.style.display = 'block';
            } else {
                nextBtn.textContent = '重新開始';
                nextBtn.style.display = 'block';
                nextBtn.onclick = () => {
                    currentLevel = 0;
                    initLevel();
                    nextBtn.onclick = nextLevel; // 恢復下一關的綁定
                };
            }
        }

        function nextLevel() {
            currentLevel++;
            initLevel();
        }

        // 啟動遊戲
        initLevel();
    </script>
</body>
</html>
