<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>遊戲王 - 幾何圖形對對碰</title>
    <style>
        :root {
            --primary-color: #2B579A; 
            --bg-color: #F7F9FC;
            --grid-border: #222222;
            --cell-size: 70px; /* 由 JS 動態計算並即時更新 */
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', '微軟正黑體', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 6px) 6px env(safe-area-inset-bottom, 6px) 6px;
        }

        /* 頂部整合資訊列（高度壓縮在 40px 內，釋放最大空間給棋盤） */
        header {
            width: 100%;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            flex-shrink: 0;
        }

        #star-container {
            font-size: 20px;
            letter-spacing: 2px;
            min-width: 80px;
        }

        #message-area {
            font-size: 17px;
            font-weight: 800;
            color: var(--primary-color);
            text-align: center;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 核心棋盤區域 */
        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-grow: 1;
            min-height: 0;
        }

        .game-area {
            display: flex;
            flex-direction: column; /* 直向手機上下排列 */
            gap: 12px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* 平板或橫向手機左右排列 */
        @media (orientation: landscape), (min-width: 700px) {
            .game-area {
                flex-direction: row;
                gap: 20px;
            }
        }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-label {
            font-size: 15px;
            margin-bottom: 4px;
            color: #111;
            font-weight: 800;
            background: #E2EAF4;
            padding: 2px 14px;
            border-radius: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, var(--cell-size));
            grid-template-rows: repeat(3, var(--cell-size));
            border: 3px solid var(--grid-border);
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .cell {
            border: 1.5px solid var(--grid-border);
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .player-cell.drag-over {
            background-color: #D3E3FD;
            outline: 3px dashed var(--primary-color);
            outline-offset: -3px;
        }

        /* 待選圖形池（高度與寬度放大） */
        .bottom-shelf {
            width: 100%;
            height: calc(var(--cell-size) + 18px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .shape-pool {
            display: flex;
            gap: 20px;
            padding: 4px 18px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            height: 100%;
            align-items: center;
            justify-content: center;
        }

        /* 圖形尺寸占滿格子的 88%，並加大點擊判斷面積 */
        .shape {
            width: calc(var(--cell-size) * 0.88);
            height: calc(var(--cell-size) * 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            cursor: grab;
        }

        .shape svg {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 拖曳中的手感優化：以指尖為中心微放大 */
        .shape.dragging {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.9;
            transform: scale(1.18) translate(-50%, -50%);
            transform-origin: top left;
        }

        /* 過關及操作按鈕 */
        #next-btn {
            display: none;
            padding: 10px 28px;
            font-size: 18px;
            background-color: #2E7D32;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        #end-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .big-icon {
            font-size: 90px;
            margin-bottom: 10px;
        }

        .end-message {
            font-size: 26px;
            color: #2E7D32;
            font-weight: 900;
            margin-bottom: 24px;
        }

        .play-again-btn {
            padding: 12px 32px;
            font-size: 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <header>
        <div id="star-container"></div>
        <div id="message-area">把圖形放到正確位置！</div>
    </header>

    <div id="game-wrapper">
        <div class="game-area">
            <div class="board-container">
                <div class="board-label">先觀察 🔎</div>
                <div id="target-grid" class="grid"></div>
            </div>
            <div class="board-container">
                <div class="board-label">試一試 💪</div>
                <div id="player-grid" class="grid"></div>
            </div>
        </div>
    </div>

    <div class="bottom-shelf">
        <div class="shape-pool" id="shape-pool"></div>
        <button id="next-btn" onclick="nextLevel()">下一頁 ➔</button>
    </div>

    <div id="end-screen">
        <div class="big-icon">🏆✨</div>
        <div class="end-message">太棒了，全部完成了！</div>
        <button class="play-again-btn" onclick="startGame()">再玩一次</button>
    </div>

    <script>
        const SHAPES_HTML = {
            triangle: '<svg viewBox="0 0 100 100"><polygon points="50,8 92,88 8,88" fill="none" stroke="#2B579A" stroke-width="10" stroke-linejoin="round"/></svg>',
            circle: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#2B579A" stroke-width="10"/></svg>',
            rectangle: '<svg viewBox="0 0 100 100"><rect x="12" y="24" width="76" height="52" rx="4" fill="none" stroke="#2B579A" stroke-width="10"/></svg>'
        };
        const SHAPE_TYPES = ['triangle', 'circle', 'rectangle'];

        let currentLevel = 0;
        const MAX_LEVELS = 5;
        let earnedStars = 0;
        let currentLevelData = null;
        let placedCount = 0;

        const targetGrid = document.getElementById('target-grid');
        const playerGrid = document.getElementById('player-grid');
        const shapePool = document.getElementById('shape-pool');
        const messageArea = document.getElementById('message-area');
        const nextBtn = document.getElementById('next-btn');
        const starContainer = document.getElementById('star-container');
        const gameWrapper = document.getElementById('game-wrapper');
        const endScreen = document.getElementById('end-screen');

        // 自動將格子尺寸算到視窗極限（直向／橫向自動適應）
        function resizeGridsToFitScreen() {
            const isLandscape = window.innerWidth > window.innerHeight || window.innerWidth >= 700;
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;

            // 扣除頂部（40px）及底部操作列（約 90px）與內邊距
            const availableH = screenH - 140;
            const availableW = screenW - 24;

            let targetCellSize;

            if (isLandscape) {
                // 橫向：兩組 3 欄並列，共有 6 欄
                const sizeByW = (availableW - 40) / 6;
                const sizeByH = (availableH - 30) / 3;
                targetCellSize = Math.floor(Math.min(sizeByW, sizeByH));
            } else {
                // 直向：兩組 3 列上下疊放，共有 6 列
                const sizeByW = (availableW - 20) / 3;
                const sizeByH = (availableH - 60) / 6;
                targetCellSize = Math.floor(Math.min(sizeByW, sizeByH));
            }

            // 限制最大極限，避免超大螢幕失真
            targetCellSize = Math.max(50, Math.min(targetCellSize, 110));
            document.documentElement.style.setProperty('--cell-size', `${targetCellSize}px`);
        }

        window.addEventListener('resize', resizeGridsToFitScreen);
        window.addEventListener('orientationchange', () => setTimeout(resizeGridsToFitScreen, 150));

        function generateRandomLevel() {
            let positions = [];
            while (positions.length < 3) {
                let r = Math.floor(Math.random() * 9);
                if (positions.indexOf(r) === -1) positions.push(r);
            }
            let targetMap = {};
            targetMap[positions[0]] = 'triangle';
            targetMap[positions[1]] = 'circle';
            targetMap[positions[2]] = 'rectangle';
            return { target: targetMap, requiredCount: 3 };
        }

        function startGame() {
            currentLevel = 0;
            earnedStars = 0;
            updateStars();
            endScreen.style.display = 'none';
            gameWrapper.style.display = 'flex';
            document.querySelector('.bottom-shelf').style.display = 'flex';
            resizeGridsToFitScreen();
            initLevel();
        }

        function initLevel() {
            placedCount = 0;
            targetGrid.innerHTML = '';
            playerGrid.innerHTML = '';
            shapePool.innerHTML = '';
            
            messageArea.textContent = `第 ${currentLevel + 1} 頁：請放好圖形！`;
            messageArea.style.color = 'var(--primary-color)';
            nextBtn.style.display = 'none';
            shapePool.style.display = 'flex';

            currentLevelData = generateRandomLevel();

            for (let i = 0; i < 9; i++) {
                const targetCell = document.createElement('div');
                targetCell.className = 'cell';
                if (currentLevelData.target[i]) {
                    targetCell.innerHTML = `<div class="shape">${SHAPES_HTML[currentLevelData.target[i]]}</div>`;
                }
                targetGrid.appendChild(targetCell);

                const playerCell = document.createElement('div');
                playerCell.className = 'cell player-cell';
                playerCell.dataset.index = i;
                playerGrid.appendChild(playerCell);
            }

            let poolShapes = [...SHAPE_TYPES].sort(() => Math.random() - 0.5);
            poolShapes.forEach(type => createPointerDraggableShape(type));
        }

        function createPointerDraggableShape(type) {
            const shapeDiv = document.createElement('div');
            shapeDiv.className = 'shape draggable';
            shapeDiv.dataset.type = type;
            shapeDiv.innerHTML = SHAPES_HTML[type];

            let activePointerId = null;
            let currentHoverCell = null;

            shapeDiv.addEventListener('pointerdown', (e) => {
                if (shapeDiv.parentElement !== shapePool) return;
                activePointerId = e.pointerId;
                shapeDiv.setPointerCapture(e.pointerId);

                shapeDiv.classList.add('dragging');
                shapeDiv.style.left = `${e.clientX}px`;
                shapeDiv.style.top = `${e.clientY}px`;
            });

            shapeDiv.addEventListener('pointermove', (e) => {
                if (!shapeDiv.classList.contains('dragging')) return;

                shapeDiv.style.left = `${e.clientX}px`;
                shapeDiv.style.top = `${e.clientY}px`;

                const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
                const cell = elemBelow ? elemBelow.closest('.player-cell') : null;

                if (currentHoverCell !== cell) {
                    if (currentHoverCell) currentHoverCell.classList.remove('drag-over');
                    currentHoverCell = cell;
                    if (currentHoverCell && !currentHoverCell.hasChildNodes()) {
                        currentHoverCell.classList.add('drag-over');
                    }
                }
            });

            const endDrag = (e) => {
                if (!shapeDiv.classList.contains('dragging')) return;

                shapeDiv.classList.remove('dragging');
                shapeDiv.style.left = '';
                shapeDiv.style.top = '';
                if (currentHoverCell) currentHoverCell.classList.remove('drag-over');

                const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
                const cell = dropTarget ? dropTarget.closest('.player-cell') : null;

                if (cell && !cell.hasChildNodes()) {
                    const cellIndex = parseInt(cell.dataset.index);
                    const expectedShape = currentLevelData.target[cellIndex];

                    if (expectedShape === type) {
                        const newShape = document.createElement('div');
                        newShape.className = 'shape';
                        newShape.innerHTML = SHAPES_HTML[type];
                        cell.appendChild(newShape);
                        shapeDiv.remove();

                        placedCount++;
                        messageArea.textContent = "好厲害，放對了！💪";
                        messageArea.style.color = "var(--primary-color)";

                        if (placedCount === currentLevelData.requiredCount) {
                            levelComplete();
                        }
                    } else {
                        messageArea.textContent = "欣賞你努力、再試一次！💪";
                        messageArea.style.color = "#D32F2F";
                    }
                }

                currentHoverCell = null;
                if (activePointerId !== null) {
                    try { shapeDiv.releasePointerCapture(activePointerId); } catch (err) {}
                    activePointerId = null;
                }
            };

            shapeDiv.addEventListener('pointerup', endDrag);
            shapeDiv.addEventListener('pointercancel', endDrag);

            shapePool.appendChild(shapeDiv);
        }

        function levelComplete() {
            earnedStars++;
            updateStars();
            messageArea.textContent = "太棒了，完成了！🌟";
            messageArea.style.color = "#2E7D32";
            currentLevel++;

            shapePool.style.display = 'none';
            if (currentLevel < MAX_LEVELS) {
                nextBtn.style.display = 'block';
            } else {
                setTimeout(showEndScreen, 600);
            }
        }

        function nextLevel() {
            initLevel();
        }

        function updateStars() {
            starContainer.innerHTML = '⭐'.repeat(earnedStars);
        }

        function showEndScreen() {
            gameWrapper.style.display = 'none';
            document.querySelector('.bottom-shelf').style.display = 'none';
            messageArea.textContent = '';
            endScreen.style.display = 'flex';
        }

        // 啟動
        resizeGridsToFitScreen();
        startGame();
    </script>
</body>
</html>
