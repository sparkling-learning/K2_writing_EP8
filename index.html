<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>遊戲王 - 幾何圖形對對碰</title>
    <style>
        :root {
            --primary-color: #2B579A; 
            --bg-color: #F7F9FC;
            --grid-border: #333333;
            --success-color: #2E7D32;
            --star-color: #FFB300;
            --cell-size: min(12vw, 5.5vh, 65px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', '微軟正黑體', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
        }

        /* 頂部資訊區 */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
        }

        h1 {
            color: var(--primary-color);
            font-size: clamp(16px, 3.5vh, 22px);
            margin: 0;
            text-align: center;
        }

        #star-container {
            font-size: clamp(18px, 3.5vh, 26px);
            letter-spacing: 4px;
            height: 30px;
            line-height: 30px;
            color: var(--star-color);
        }

        #message-area {
            font-size: clamp(14px, 2.5vh, 18px);
            font-weight: 700;
            color: var(--primary-color);
            min-height: 24px;
            text-align: center;
            transition: color 0.3s;
        }

        /* 遊戲核心互動區 */
        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-grow: 1;
            gap: 8px;
            min-height: 0;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* 螢幕較寬（平板橫向、電腦）時左右並排 */
        @media (min-width: 600px) and (min-height: 480px) {
            :root {
                --cell-size: min(14vw, 10vh, 75px);
            }
            .game-area {
                flex-direction: row;
                gap: 30px;
            }
        }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-label {
            font-size: clamp(13px, 2.2vh, 16px);
            margin-bottom: 4px;
            color: #333;
            font-weight: 700;
            background: #e9eff7;
            padding: 3px 12px;
            border-radius: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, var(--cell-size));
            grid-template-rows: repeat(3, var(--cell-size));
            border: 2px solid var(--grid-border);
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .cell {
            border: 1px solid var(--grid-border);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .player-cell.drag-over {
            background-color: #E3F2FD;
            outline: 2px dashed var(--primary-color);
            outline-offset: -2px;
        }

        /* 待選圖形池 */
        .shape-pool {
            display: flex;
            gap: 16px;
            padding: 8px 16px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            min-height: calc(var(--cell-size) + 12px);
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: fit-content;
            max-width: 100%;
        }

        .shape {
            width: calc(var(--cell-size) * 0.85);
            height: calc(var(--cell-size) * 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            cursor: grab;
        }

        .shape svg {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .shape.draggable {
            transition: transform 0.15s;
        }

        .shape.dragging {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.85;
            transform: scale(1.15) translate(-50%, -50%);
            transform-origin: top left;
        }

        /* 操作控制與過關畫面 */
        .action-container {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        button {
            padding: 8px 24px;
            font-size: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        button:active {
            transform: scale(0.97);
        }

        #next-btn {
            display: none;
        }

        #end-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            animation: popIn 0.4s ease-out;
        }

        .big-icon {
            font-size: clamp(60px, 12vh, 90px);
            margin-bottom: 8px;
        }

        .end-message {
            font-size: clamp(20px, 4vh, 26px);
            color: var(--success-color);
            font-weight: 700;
            margin-bottom: 20px;
        }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>強化視覺辨識與記憶力</h1>
        <div id="star-container"></div>
        <div id="message-area">準備好就開始吧！</div>
    </header>

    <div id="game-wrapper">
        <div class="game-area">
            <div class="board-container">
                <div class="board-label">先觀察 🔎</div>
                <div id="target-grid" class="grid"></div>
            </div>
            <div class="board-container">
                <div class="board-label">試一試 💪</div>
                <div id="player-grid" class="grid"></div>
            </div>
        </div>

        <div class="shape-pool" id="shape-pool"></div>
    </div>

    <div class="action-container">
        <button id="next-btn" onclick="nextLevel()">下一頁</button>
    </div>

    <div id="end-screen">
        <div class="big-icon">🏆✨</div>
        <div class="end-message">太棒了，任務完成！</div>
        <button onclick="startGame()">再玩一次</button>
    </div>

    <script>
        const SHAPES_HTML = {
            triangle: '<svg viewBox="0 0 100 100"><polygon points="50,12 88,85 12,85" fill="none" stroke="#2B579A" stroke-width="8"/></svg>',
            circle: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#2B579A" stroke-width="8"/></svg>',
            rectangle: '<svg viewBox="0 0 100 100"><rect x="15" y="28" width="70" height="44" fill="none" stroke="#2B579A" stroke-width="8"/></svg>'
        };
        const SHAPE_TYPES = ['triangle', 'circle', 'rectangle'];

        let currentLevel = 0;
        const MAX_LEVELS = 5;
        let earnedStars = 0;
        let currentLevelData = null;
        let placedCount = 0;

        const targetGrid = document.getElementById('target-grid');
        const playerGrid = document.getElementById('player-grid');
        const shapePool = document.getElementById('shape-pool');
        const messageArea = document.getElementById('message-area');
        const nextBtn = document.getElementById('next-btn');
        const starContainer = document.getElementById('star-container');
        const gameWrapper = document.getElementById('game-wrapper');
        const endScreen = document.getElementById('end-screen');

        function generateRandomLevel() {
            let positions = [];
            while (positions.length < 3) {
                let r = Math.floor(Math.random() * 9);
                if (positions.indexOf(r) === -1) positions.push(r);
            }
            let targetMap = {};
            targetMap[positions[0]] = 'triangle';
            targetMap[positions[1]] = 'circle';
            targetMap[positions[2]] = 'rectangle';
            return { target: targetMap, requiredCount: 3 };
        }

        function startGame() {
            currentLevel = 0;
            earnedStars = 0;
            updateStars();
            endScreen.style.display = 'none';
            gameWrapper.style.display = 'flex';
            initLevel();
        }

        function initLevel() {
            placedCount = 0;
            targetGrid.innerHTML = '';
            playerGrid.innerHTML = '';
            shapePool.innerHTML = '';
            
            messageArea.textContent = `第 ${currentLevel + 1} 頁：請把它們放到正確的位置！`;
            messageArea.style.color = 'var(--primary-color)';
            nextBtn.style.display = 'none';

            currentLevelData = generateRandomLevel();

            for (let i = 0; i < 9; i++) {
                const targetCell = document.createElement('div');
                targetCell.className = 'cell';
                if (currentLevelData.target[i]) {
                    targetCell.innerHTML = `<div class="shape">${SHAPES_HTML[currentLevelData.target[i]]}</div>`;
                }
                targetGrid.appendChild(targetCell);

                const playerCell = document.createElement('div');
                playerCell.className = 'cell player-cell';
                playerCell.dataset.index = i;
                playerGrid.appendChild(playerCell);
            }

            let poolShapes = [...SHAPE_TYPES].sort(() => Math.random() - 0.5);
            poolShapes.forEach(type => createPointerDraggableShape(type));
        }

        function createPointerDraggableShape(type) {
            const shapeDiv = document.createElement('div');
            shapeDiv.className = 'shape draggable';
            shapeDiv.dataset.type = type;
            shapeDiv.innerHTML = SHAPES_HTML[type];

            let activePointerId = null;
            let currentHoverCell = null;

            shapeDiv.addEventListener('pointerdown', (e) => {
                if (shapeDiv.parentElement !== shapePool) return;
                activePointerId = e.pointerId;
                shapeDiv.setPointerCapture(e.pointerId);

                shapeDiv.classList.add('dragging');
                shapeDiv.style.left = `${e.clientX}px`;
                shapeDiv.style.top = `${e.clientY}px`;
            });

            shapeDiv.addEventListener('pointermove', (e) => {
                if (!shapeDiv.classList.contains('dragging')) return;

                shapeDiv.style.left = `${e.clientX}px`;
                shapeDiv.style.top = `${e.clientY}px`;

                const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
                const cell = elemBelow ? elemBelow.closest('.player-cell') : null;

                if (currentHoverCell !== cell) {
                    if (currentHoverCell) currentHoverCell.classList.remove('drag-over');
                    currentHoverCell = cell;
                    if (currentHoverCell && !currentHoverCell.hasChildNodes()) {
                        currentHoverCell.classList.add('drag-over');
                    }
                }
            });

            const endDrag = (e) => {
                if (!shapeDiv.classList.contains('dragging')) return;

                shapeDiv.classList.remove('dragging');
                shapeDiv.style.left = '';
                shapeDiv.style.top = '';
                if (currentHoverCell) {
                    currentHoverCell.classList.remove('drag-over');
                }

                const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
                const cell = dropTarget ? dropTarget.closest('.player-cell') : null;

                if (cell && !cell.hasChildNodes()) {
                    const cellIndex = parseInt(cell.dataset.index);
                    const expectedShape = currentLevelData.target[cellIndex];

                    if (expectedShape === type) {
                        const newShape = document.createElement('div');
                        newShape.className = 'shape';
                        newShape.innerHTML = SHAPES_HTML[type];
                        cell.appendChild(newShape);
                        shapeDiv.remove();

                        placedCount++;
                        messageArea.textContent = "欣賞你，你好努力！💪";
                        messageArea.style.color = "var(--primary-color)";

                        if (placedCount === currentLevelData.requiredCount) {
                            levelComplete();
                        }
                    } else {
                        messageArea.textContent = "欣賞你努力、再試一次！💪";
                        messageArea.style.color = "#D32F2F";
                    }
                }

                currentHoverCell = null;
                if (activePointerId !== null) {
                    try { shapeDiv.releasePointerCapture(activePointerId); } catch (err) {}
                    activePointerId = null;
                }
            };

            shapeDiv.addEventListener('pointerup', endDrag);
            shapeDiv.addEventListener('pointercancel', endDrag);

            shapePool.appendChild(shapeDiv);
        }

        function levelComplete() {
            earnedStars++;
            updateStars();
            messageArea.textContent = "太棒了，完成這頁了！🌟";
            messageArea.style.color = "var(--success-color)";
            currentLevel++;

            if (currentLevel < MAX_LEVELS) {
                nextBtn.style.display = 'block';
            } else {
                setTimeout(showEndScreen, 700);
            }
        }

        function nextLevel() {
            initLevel();
        }

        function updateStars() {
            starContainer.innerHTML = '⭐'.repeat(earnedStars);
        }

        function showEndScreen() {
            gameWrapper.style.display = 'none';
            messageArea.textContent = '';
            nextBtn.style.display = 'none';
            endScreen.style.display = 'flex';
        }

        startGame();
    </script>
</body>
</html>
